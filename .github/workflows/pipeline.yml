name: Tinycloud Backend Pipeline
on:
    push:
        branches: [feature/initial]
env:
    AWS_REGION: eu-north-1
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v5
              with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                aws-region: ${{ env.AWS_REGION }}
            
            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Build and Push Docker image
              run: |
                docker build --no-cache -t tinycloud-backend:latest .
                docker tag tinycloud-backend:latest ${{ steps.login-ecr.outputs.registry }}/tinycloud-backend:${{ github.sha }}
                docker push ${{ steps.login-ecr.outputs.registry }}/tinycloud-backend:${{ github.sha }}
            
            - name: Build and Push Helm chart
              run: |
                helm package charts/tinycloud-backend
                helm push tinycloud-backend-*.tgz oci://${{ steps.login-ecr.outputs.registry }}
