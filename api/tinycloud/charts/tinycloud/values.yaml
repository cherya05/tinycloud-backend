replicaCount: 1

image:
  repository: tinycloud-app
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 5000

ingress:
  enabled: true
  className: ""
  annotations: {}
  hosts:
    - host: tinycloud.app
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /url-mapping/
    port: 5000
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /url-mapping/
    port: 5000
  initialDelaySeconds: 5
  periodSeconds: 5

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 50

database:
  enabled: false
  type: postgresql
  host: tinycloud-tinycloud-chart-postgresql
  port: 5432
  username: tinycloud
  password: tiny123!
  database: tinycloud

env:
  FLASK_ENV: production
  DATABASE_URL: postgresql://tinycloud:tiny123!@tinycloud-tinycloud-chart-postgresql:5432/tinycloud

nodeSelector: {}
tolerations: []
affinity: {}
