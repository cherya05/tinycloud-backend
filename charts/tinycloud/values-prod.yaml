replicaCount: 1

image:
  repository: 242902229138.dkr.ecr.eu-north-1.amazonaws.com/tinycloud-app
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""


podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: "nginx"
  annotations:
    external-dns.alpha.kubernetes.io/hostname: prod.hatstore-danil.info
  hosts:
    - host: prod.hatstore-danil.info
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /url-mapping/
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /url-mapping/
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 5

secretName: "postgresql-prod-secret"

postgresql:
  username: ""
  password: ""
  database: tinycloud
  host: postgresql-db-prod

env:
  FLASK_ENV: production
  FLASK_APP: manage.py
  ELASTICSEARCH_HOST: "elasticsearch-master"
  ELASTICSEARCH_PORT: "9200"

tolerations:
  - key: "environment"
    operator: "Equal"
    value: "prod"
    effect: "NoSchedule"

storageclass:
  type: "gp2"
  encrypted: false
  volumeBindingMode: WaitForFirstConsumer
  allowVolumeExpansion: true
  reclaimPolicy: Delete

persistence:
  enabled: true
  storageClassName: default
  accessMode: ReadWriteOnce
  size: 10Gi
  
nodeSelector:
  environment: "prod"