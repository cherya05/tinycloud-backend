provider:
  name: aws

extraArgs:
  - --aws-zone-type=public
  - --domain-filter=hatstore-danil.info
  - --txt-owner-id=tinycloud-staging-id
  - --txt-prefix=external-dns-
  - --namespace=tinycloud-staging

env:
  - name: AWS_REGION
    value: "eu-north-1"
  - name: EXTERNAL_DNS_RESOLVE_SERVICE_LOAD_BALANCER_HOSTNAME
    value: "true"

nodeSelector:
  environment: "staging"

tolerations:
  - key: "environment"
    operator: "Equal"
    value: "staging"
    effect: "NoSchedule"

resources:
  limits:
    memory: 128Mi
    cpu: 100m
  requests:
    memory: 64Mi
    cpu: 50m