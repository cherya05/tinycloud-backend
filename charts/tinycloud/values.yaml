replicaCount: 1

image:
  repository: tinycloud-app
  pullPolicy: Never
  tag: "v1"

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 8081

ingress:
  enabled: true
  className: ""
  annotations: {}
  hosts:
    - host: tinycloud.app
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /
    port: 8081
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /
    port: 8081
  initialDelaySeconds: 5
  periodSeconds: 5

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 50

database:
  enabled: true

env:
  FLASK_ENV: production
  FLASK_APP: manage.py
  DATABASE_URL: postgresql://tinycloud:tiny123!@tinycloud-postgresql:5432/tinycloud

nodeSelector: {}
tolerations: []
affinity: {}