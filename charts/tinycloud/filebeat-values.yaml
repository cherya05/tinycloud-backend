name: filebeat-tinycloud

spec:
  type: filebeat
  version: 8.12.0
  elasticsearchRef:
    name: elasticsearch-tinycloud
    namespace: elasticsearch
  config:
    filebeat.inputs:
      - type: container
        paths:
          - /var/log/containers/*.log
    processors:
      - add_kubernetes_metadata:
          host: ${NODE_NAME}
          matchers:
            - logs_path:
                logs_path: "/var/log/containers/"

  daemonSet:
    podTemplate:
      spec:
        affinity: {}
        containers:
          - name: filebeat
            resources:
              requests:
                cpu: "50m"
                memory: "100Mi"
            volumeMounts:
              - name: varlogcontainers
                mountPath: /var/log/containers
              - name: varlogpods
                mountPath: /var/log/pods
        securityContext:
          runAsUser: 0
        volumes:
          - name: varlogcontainers
            hostPath:
              path: /var/log/containers
          - name: varlogpods
            hostPath:
              path: /var/log/pods