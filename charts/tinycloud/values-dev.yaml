replicaCount: 1

image:
  repository: cheryyaaaaaaa/tinycloud-app
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""


podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: "nginx"
  annotations:
    external-dns.alpha.kubernetes.io/hostname: dev.hatstore-danil.info
  hosts:
    - host: dev.hatstore-danil.info
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

elasticsearch:
  enabled: false
  replicas: 1
  minimumMasterNodes: 1
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  volumeClaimTemplate:
    accessModes: ["ReadWriteOnce"]
    resources:
      requests:
        storage: 10Gi
        
  podDisruptionBudget:
    enabled: false

livenessProbe:
  httpGet:
    path: /url-mapping/
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /url-mapping/
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 5

secretName: "postgresql-dev-secret"

postgresql:
  username: ""
  password: ""
  database: tinycloud
  host: postgresql-db-dev

env:
  FLASK_ENV: dev
  FLASK_APP: manage.py
  ELASTICSEARCH_HOST: "elasticsearch-master"
  ELASTICSEARCH_PORT: "9200"

# tolerations:
#   - key: "environment"
#     operator: "Equal"
#     value: "dev"
#     effect: "NoSchedule"

storageclass:
  type: "gp2"
  fsType: "ext4"
  encrypted: false
  volumeBindingMode: WaitForFirstConsumer
  allowVolumeExpansion: true
  reclaimPolicy: Delete

persistence:
  enabled: true
  storageClassName: default
  accessMode: ReadWriteOnce
  size: 10Gi

# nodeSelector:
#   environment: "dev"
