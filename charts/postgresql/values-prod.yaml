postgresql:
  name: "postgresql"
  username: ""
  password: ""
  database: ""
  host: ""
  port: ""
  protocol: "TCP"
  storage:
    type: "emptyDir"
    pvc:
      size: 1Gi
      storageClass: ""
      accessModes:
        - ReadWriteOnce

image:
  repository: postgres
  pullPolicy: IfNotPresent
  tag: "15"

resources:
  limits:
      cpu: 500m
      memory: 384Mi
  requests:
      cpu: 100m
      memory: 128Mi

secretName: "postgresql-prod-secret"

env:
  FLASK_ENV: production

# Storage class

type: gp2
fsType: ext4

persistence:
  enabled: true
  encrypted: false
  storageClassName: default
  accessMode: ReadWriteOnce
  size: 10Gi
  
