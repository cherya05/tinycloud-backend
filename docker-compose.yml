services:
  app:
    build: .
    ports:
      - "8081:8081"
    environment:
      - DATABASE_URL=postgresql://${user}:${password}@db:5432/${name}
      - FLASK_APP=manage.py
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:14.18
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${user}
      - POSTGRES_PASSWORD=${password}
      - POSTGRES_DB=${name}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tinycloud -d tinycloud"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
